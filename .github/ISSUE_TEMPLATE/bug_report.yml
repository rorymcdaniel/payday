name: Bug report
description: Report a reproducible problem using synthetic data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Payday. For a vulnerability, stop and follow SECURITY.md instead. Never submit a token, database, export, identifier, or real financial screenshot.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I have removed or replaced all credentials, identifiers, and personal financial data.
          required: true
        - label: This is not a security vulnerability or privacy incident.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed result and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps and synthetic category names and amounts. Say whether Practice Mode reproduces it.
      placeholder: |
        1. Launch with --demo
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Payday version or commit
      placeholder: Commit SHA or app version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac architecture
      placeholder: macOS 15.6, Apple Silicon
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift version
      description: Run `swift --version` when reporting a build or test problem.
  - type: textarea
    id: context
    attributes:
      label: Additional non-sensitive context
      description: Add sanitized logs or synthetic screenshots only. Payday intentionally does not log YNAB payloads.
