name: macOS checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android build tools
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'"
      - name: Test, lint, and build Android
        run: android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Upload Android check reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Payday-Android-checks
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build with warnings treated as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test financial logic and API contract
        run: swift test --enable-code-coverage
      - name: Check coverage policy
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          report="$(swift test --show-codecov-path)"
          if [ -n "$PR_BASE_SHA" ]; then
            python3 scripts/check-coverage.py "$report" --base "$PR_BASE_SHA"
          else
            python3 scripts/check-coverage.py "$report"
          fi
      - name: Build local app bundle
        run: bash scripts/package.sh
      - name: Upload unsigned development bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Payday-macOS
          path: dist/Payday.app
          if-no-files-found: error
          retention-days: 7
